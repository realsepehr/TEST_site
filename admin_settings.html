{% extends 'base.html' %}{% block content %}<div class="wrap section"><h1>تنظیمات سایت</h1><form method="post" class="panel" style="max-width:760px;display:grid;gap:14px;padding:24px"><label>نام سایت<input name="site_name" value="{{settings.site_name}}"></label><label>شعار سایت<input name="tagline" value="{{settings.tagline}}"></label><label>شماره تماس<input name="phone" value="{{settings.phone}}"></label><label>آدرس<input name="address" value="{{settings.address}}"></label><label>عنوان اصلی<input name="hero_title" value="{{settings.hero_title}}"></label><label>متن اصلی<textarea name="hero_text" rows="5">{{settings.hero_text}}</textarea></label><button class="btn" type="submit">ذخیره تنظیمات</button></form></div><style>.panel label{display:grid;gap:7px;font-size:12px}.panel input,.panel textarea{padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}.btn{padding:13px;border:0;border-radius:12px;background:#b58b42;color:#fff;font-weight:800}</style>{% endblock %}
