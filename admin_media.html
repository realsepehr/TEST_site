{% extends 'base.html' %}{% block content %}<div class="wrap section"><h1>مدیریت رسانه‌ها</h1><form method="post" enctype="multipart/form-data" class="form"><input type="file" name="image" accept="image/*" required><button class="btn">⬆️ آپلود تصویر</button></form><div class="media-grid">{% for f in files %}<article><img src="/static/uploads/{{f.name}}" loading="lazy"><b>{{f.name}}</b><small>{{(f.size/1024)|round(1)}} KB · {{f.mtime}}</small><form method="post" action="/admin/media/delete/{{f.name}}"><button class="danger" onclick="return confirm('حذف تصویر؟')">حذف</button></form></article>{% else %}<p>تصویری وجود ندارد.</p>{% endfor %}</div></div><style>.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px;margin-top:25px}.media-grid article{padding:12px;border:1px solid #ffffff12;border-radius:16px;background:#ffffff06}.media-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}.media-grid b,.media-grid small{display:block;margin-top:8px;overflow:hidden;text-overflow:ellipsis}.media-grid small{color:#999}.danger{margin-top:10px;background:#ff3d3d18;color:#ff8b8b;border:1px solid #ff3d3d44;padding:8px 12px;border-radius:9px}</style>{% endblock %}
