
{% extends "base.html" %}{% block title %}دسته‌بندی‌ها{% endblock %}{% block content %}
<section class="container section narrow"><div class="admin-top"><div><span class="eyebrow">مدیریت</span><h1>دسته‌بندی‌ها</h1></div><a class="small-btn" href="{{url_for('dashboard')}}">بازگشت</a></div><form class="panel inline-form" method="post"><input name="name" placeholder="نام دسته‌بندی جدید" required><input name="sort_order" type="number" placeholder="ترتیب"><button class="btn">افزودن</button></form><div class="list">{% for c in cats %}<div><b>{{c.name}}</b><span>{{c.count}} محصول</span><form method="post" action="{{url_for('delete_category',cid=c.id)}}" onsubmit="return confirm('حذف دسته‌بندی؟')"><button class="danger">حذف</button></form></div>{% endfor %}</div></section>
{% endblock %}
