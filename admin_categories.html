{% extends 'base.html' %}{% block content %}<div class="wrap section"><h1>مدیریت دسته‌بندی‌ها</h1><form method="post" action="{{ url_for('admin_categories') }}" class="form"><input name="name" placeholder="نام دسته‌بندی" required><input name="slug" placeholder="slug انگلیسی اختیاری"><button class="btn" type="submit">➕ افزودن</button></form><div class="admin-table">{% for c in categories %}<div class="row"><div><b>{{c.name}}</b><small>{{c.slug}} · {{c.product_count}} محصول</small></div><form method="post" action="{{ url_for('admin_category_delete', cid=c.id) }}"><button type="submit" class="danger" onclick="return confirm('حذف شود؟')">حذف</button></form></div>{% else %}<p>دسته‌ای وجود ندارد.</p>{% endfor %}</div></div><style>.admin-table{margin-top:25px}.row{display:flex;justify-content:space-between;align-items:center;padding:18px;border:1px solid #ffffff12;border-radius:15px;margin:10px 0;background:#ffffff06}.row small{display:block;color:#999;margin-top:5px}.danger{background:#ff3d3d18;color:#ff8b8b;border:1px solid #ff3d3d44;padding:9px 14px;border-radius:10px}</style>{% endblock %}
